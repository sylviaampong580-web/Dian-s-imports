<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - [YOUR BUSINESS NAME]</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
  header { background: #0a3d62; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 20px; margin-bottom: 8px; }
  nav a { color: white; text-decoration: none; margin: 0 6px; font-size: 13px; }
  .section { padding: 20px 15px; max-width: 700px; margin: auto; }
  .section h2 { color: #0a3d62; margin-bottom: 15px; }
  .cart-item { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .cart-item .info { flex: 1; }
  .cart-item h4 { font-size: 14px; }
  .cart-item .price { color: #f39c12; font-weight: bold; font-size: 13px; }
  .qty-controls { display: flex; align-items: center; gap: 8px; }
  .qty-controls button { background: #0a3d62; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; font-size: 16px; cursor: pointer; }
  .remove-btn { background: #e74c3c !important; }
  .total { background: white; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; font-size: 16px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .btn { display: block; background: #f39c12; color: white; text-align: center; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; }
  .btn:hover { background: #e67e22; }
  .empty { text-align: center; padding: 40px 15px; color: #777; }
  .whatsapp-btn { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 200; }
</style>
</head>
<body>

<header>
  <h1>[YOUR BUSINESS NAME]</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="preorder.html">Preorder</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="section">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <div class="total" id="total" style="display:none;">Total: $<span id="totalAmount">0.00</span></div>
  <a href="order.html" class="btn" id="checkoutBtn" style="display:none;">Proceed to Checkout</a>
</section>

<a href="https://wa.me/234XXXXXXXXXX" class="whatsapp-btn" target="_blank">💬</a>

<script>
  function getCart() { return JSON.parse(localStorage.getItem("cart") || "[]"); }
  function saveCart(cart) { localStorage.setItem("cart", JSON.stringify(cart)); render(); }

  function render() {
    const cart = getCart();
    const container = document.getElementById("cartItems");
    const totalDiv = document.getElementById("total");
    const checkoutBtn = document.getElementById("checkoutBtn");

    if (cart.length === 0) {
      container.innerHTML = `<div class="empty"><p>Your cart is empty.</p><p><a href="products.html" style="color:#0a3d62;">Browse products →</a></p></div>`;
      totalDiv.style.display = "none";
      checkoutBtn.style.display = "none";
      return;
    }

    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="info">
          <h4>${item.name}</h4>
          <p class="price">$${item.price.toFixed(2)} × ${item.qty}</p>
        </div>
        <div class="qty-controls">
          <button onclick="changeQty(${item.id}, -1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.id}, 1)">+</button>
          <button class="remove-btn" onclick="removeItem(${item.id})">🗑</button>
        </div>
      </div>
    `).join("");

    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById("totalAmount").textContent = total.toFixed(2);
    totalDiv.style.display = "block";
    checkoutBtn.style.display = "block";
  }

  function changeQty(id, delta) {
    const cart = getCart();
    const item = cart.find(x => x.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      const idx = cart.indexOf(item);
      cart.splice(idx, 1);
    }
    saveCart(cart);
  }
  function removeItem(id) {
    const cart = getCart().filter(x => x.id !== id);
    saveCart(cart);
  }
  render();
</script>

</body>
</html>
