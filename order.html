<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - [YOUR BUSINESS NAME]</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
  header { background: #0a3d62; color: white; padding: 15px; text-align: center; }
  header h1 { font-size: 20px; margin-bottom: 8px; }
  nav a { color: white; text-decoration: none; margin: 0 6px; font-size: 13px; }
  .section { padding: 20px 15px; max-width: 600px; margin: auto; }
  .section h2 { color: #0a3d62; margin-bottom: 15px; }
  form { background: white; padding: 18px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; margin-top: 12px; color: #0a3d62; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
  input:focus, textarea:focus { outline: none; border-color: #0a3d62; }
  .btn { background: #f39c12; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 18px; font-size: 15px; cursor: pointer; }
  .btn:hover { background: #e67e22; }
  .summary { background: #eaf4fb; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 13px; }
  .summary h4 { color: #0a3d62; margin-bottom: 8px; }
  .whatsapp-btn { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 200; }
</style>
</head>
<body>

<header>
  <h1>[YOUR BUSINESS NAME]</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="preorder.html">Preorder</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="section">
  <h2>Customer Order Form</h2>
  <form id="orderForm">
    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Phone Number</label>
    <input type="tel" id="phone" required>

    <label>Email (optional)</label>
    <input type="email" id="email">

    <label>Delivery Address</label>
    <textarea id="address" rows="3" required></textarea>

    <label>Additional Notes (optional)</label>
    <textarea id="notes" rows="2"></textarea>

    <div class="summary" id="summary"></div>

    <button type="submit" class="btn">Place Order</button>
  </form>
</section>

<a href="https://wa.me/234XXXXXXXXXX" class="whatsapp-btn" target="_blank">💬</a>

<script>
  function getCart() { return JSON.parse(localStorage.getItem("cart") || "[]"); }

  function showSummary() {
    const cart = getCart();
    const summary = document.getElementById("summary");
    if (cart.length === 0) {
      summary.innerHTML = "<p>Your cart is empty. <a href='products.html'>Add products →</a></p>";
      return;
    }
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    summary.innerHTML = `<h4>Order Summary</h4>` +
      cart.map(i => `<p>${i.name} × ${i.qty} — $${(i.price * i.qty).toFixed(2)}</p>`).join("") +
      `<p style="margin-top:8px;"><strong>Total: $${total.toFixed(2)}</strong></p>`;
  }
  showSummary();

  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const cart = getCart();
    if (cart.length === 0) { alert("Your cart is empty!"); return; }

    const order = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      address: document.getElementById("address").value,
      notes: document.getElementById("notes").value,
      items: cart,
      total: cart.reduce((s, i) => s + i.price * i.qty, 0),
      date: new Date().toLocaleString()
    };
    localStorage.setItem("lastOrder", JSON.stringify(order));
    window.location.href = "payment.html";
  });
</script>

</body>
</html>
